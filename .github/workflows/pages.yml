name: Publish Nusuk Keys List
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test updater and stored progress
        if: ${{ !contains(github.event.head_commit.message, '[data-only]') }}
        run: python Kumpulan-Key/test_update_web_malam.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Salin-Kode-Nusuk
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
